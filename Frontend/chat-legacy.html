<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstateAI — Legacy WASM Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Source Sans 3", sans-serif; background: #faf7f2; margin: 0; padding: 24px; }
    .box { max-width: 640px; margin: 0 auto; background: white; border-radius: 16px; padding: 20px; border: 1px solid #e7e5e4; }
    a { color: #0f766e; }
    #chat { height: 360px; overflow: auto; border: 1px solid #e7e5e4; border-radius: 12px; padding: 12px; margin: 12px 0; }
    .msg { margin: 8px 0; }
    .user { color: #115e59; }
    .agent { color: #1c1917; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #e7e5e4; }
    button { padding: 10px 16px; border: 0; border-radius: 999px; background: #0f766e; color: white; }
  </style>
</head>
<body>
  <div class="box">
    <p><a href="index.html">← Back to EstateAI</a></p>
    <h1>Legacy Pyodide + LangGraph chat</h1>
    <p id="status">Loading…</p>
    <div id="chat"></div>
    <div class="row">
      <input id="input" disabled placeholder="Message…" />
      <button id="send" disabled>Send</button>
    </div>
  </div>
  <script>
    const worker = new Worker("worker.js");
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    let ready = false;
    function add(text, cls) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    worker.onmessage = (e) => {
      if (e.data.status === "ready") {
        ready = true;
        status.textContent = "Agent ready";
        input.disabled = false;
        send.disabled = false;
      } else if (e.data.status === "loading") {
        status.textContent = e.data.message || "Loading…";
      } else if (e.data.error) {
        add("Error: " + e.data.error, "agent");
      } else if (e.data.result !== undefined) {
        add(e.data.result, "agent");
      }
    };
    function go() {
      const m = input.value.trim();
      if (!m || !ready) return;
      add(m, "user");
      input.value = "";
      worker.postMessage(m);
    }
    send.onclick = go;
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") go(); });
  </script>
</body>
</html>
